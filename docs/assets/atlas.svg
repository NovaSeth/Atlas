<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Atlas</title>
  <!-- Contour lines of a map: three circles (r 176, 120, 64) internally tangent at one point (256,432), like the
       level sets of a hill. The dot is the summit: the known shape the server is measured against. -->
