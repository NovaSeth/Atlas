    <circle cx="256" cy="256" r="176"/>
    <circle cx="256" cy="312" r="120"/>
    <circle cx="256" cy="368" r="64"/>
  </g>
  <circle cx="256" cy="368" r="26" fill="#F59E0B"/>
</svg>
