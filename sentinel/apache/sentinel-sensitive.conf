# Sentinel: dedicated log of requests for sensitive paths (read by sentinel-stream).
# Deploy: copy to /etc/apache2/conf-available/sentinel-sensitive.conf,
#   a2enconf sentinel-sensitive, apache2ctl configtest, systemctl reload apache2.
# Server-wide context, so it applies to every vhost. GlobalLog (Apache >= 2.4.19), NOT CustomLog:
# a server-level CustomLog is not inherited by vhosts that define their own CustomLog. Needs mod_setenvif (enabled by default on Debian).
#
# %B = response BODY bytes. The stock `combined` format logs %O (incl. headers + TLS overhead):
# an empty 200 on /wp-config.php once looked like a 4.6 kB leak. Do not use %O here.
#
# Covered paths (case-insensitive, matched against the URL path without the query string):
#   wp-config.php in any prefix/variant (wp-config.php.bak, /backup/wp-config.php~, wp-config-sample ...)
#   /.env  /.git/  dump.sql  *.sql.gz  /phpinfo.php  /server-status
SetEnvIfNoCase Request_URI "wp-config" sentinel_sensitive=1
SetEnvIfNoCase Request_URI "/\.env" sentinel_sensitive=1
SetEnvIfNoCase Request_URI "/\.git/" sentinel_sensitive=1
SetEnvIfNoCase Request_URI "dump\.sql" sentinel_sensitive=1
SetEnvIfNoCase Request_URI "\.sql\.gz" sentinel_sensitive=1
SetEnvIfNoCase Request_URI "/phpinfo\.php" sentinel_sensitive=1
SetEnvIfNoCase Request_URI "/server-status" sentinel_sensitive=1

GlobalLog ${APACHE_LOG_DIR}/sentinel-sensitive.log "%{%Y-%m-%dT%H:%M:%S}t %v %a %>s %B \"%r\"" env=sentinel_sensitive
