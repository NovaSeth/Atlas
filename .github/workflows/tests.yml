name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 git
          python3 -m pip install --quiet pytest pytest-cov==5.0.0

      - name: Commit subjects
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: bash .github/check-commits.sh "$BASE" "$HEAD"

      - name: Unit tests
        run: python3 -m pytest -q --cov=atlas --cov=sentinel --cov=agent/claude-code/hooks --cov-config=.github/coveragerc --cov-fail-under=60

      - name: Shell syntax (bash -n on every tracked *.sh)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "syntax error: $f"
              status=1
            fi
          done < <(git ls-files -z '*.sh')
          exit "$status"

      - name: Ruff lint and format
        run: |
          python3 -m pip install --quiet ruff==0.17.3
          ruff check --config .github/ruff.toml .
          ruff format --config .github/ruff.toml --check .

      - name: Shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          git ls-files -z '*.sh' | xargs -0 shellcheck -x

      - name: Installer dry run
        run: ./install.sh --dry-run --code /opt/atlas --state /tmp/atlas-dry --user atlas

  verify-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag object
        # checkout creates a lightweight tag at the commit; verify-tag needs the signed tag object itself
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Verify signed tag
        run: git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$GITHUB_REF_NAME"
