name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 git
          python3 -m pip install --quiet pytest

      - name: Unit tests
        run: python3 -m pytest -q

      - name: Shell syntax (bash -n on every tracked *.sh)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "syntax error: $f"
              status=1
            fi
          done < <(git ls-files -z '*.sh')
          exit "$status"

      - name: Installer dry run
        run: ./install.sh --dry-run --code /opt/atlas --state /tmp/atlas-dry --user atlas
